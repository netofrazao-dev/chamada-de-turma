<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Challenger Presença</title>
  <meta name="description" content="Controle de frequência e chamadas da Challenger Language School.">

  <!-- Cores da barra do navegador / status bar -->
  <meta name="theme-color" content="#13215a">
  <meta name="color-scheme" content="light dark">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">

  <!-- iPhone / iPad -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Presença">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Conexões antecipadas (carrega mais rápido) -->
  <link rel="preconnect" href="https://fuuwchrbxqusnkmxfmym.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/+esm" crossorigin>

  <script>
    // Guarda o "#" original (links de confirmação / nova senha do Supabase)
    window.__hashInicial = location.hash;
    // Aplica o tema salvo antes de desenhar a página (evita "piscar")
    try {
      var t = JSON.parse(localStorage.getItem("tema"));
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/app.css?v=2.0.0">
</head>
<body>
  <div id="app">
    <div class="splash"><img src="icons/globe-128.png" alt="" width="72" height="72"><span class="spinner"></span></div>
  </div>

  <noscript>
    <p style="padding:24px;font-family:sans-serif;text-align:center">
      Para usar o Challenger Presença, ative o JavaScript no seu navegador.
    </p>
  </noscript>

  <script type="module" src="js/app.js?v=2.0.0"></script>
</body>
</html>
